main:
  train_only: True
  predict_only: False
  dataset_name: "insurance"
  use_gradient_boosting: False

gradient_boosting:
  weak_learner: "neural_network"
  upsilon: 0.8
  learning_rate: 0.01
  patience: 10
  max_iter: 5

decision_tree:
  init_params:
    max_depth: 5
  fit_params: null

neural_network:
  init_params: null
  fit_params:
    epochs: 20
    learning_rate: 0.01
    patience: 3