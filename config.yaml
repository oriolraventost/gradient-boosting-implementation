main:
  active_dataset: "scores"
  run_preprocess: true
  train_and_predict: false
  prediction_mode: "probability"

datasets:
  heart:
    id_column: "id"
    target: "Heart Disease"
    cat_cols:
      - "Sex"
      - "Chest pain type"
      - "FBS over 120"
      - "EKG results"
      - "Exercise angina"
      - "Slope of ST"
      - "Number of vessels fluro"
      - "Thallium"
    num_cols:
      - "Age"
      - "BP"
      - "Cholesterol"
      - "Max HR"
      - "ST depression"
    problem_type: "classification"
  scores:
    id_column: "id"
    target: "exam_score"
    cat_cols:
      - "gender"
      - "course"
      - "internet_access"
      - "sleep_quality"
      - "study_method"
      - "facility_rating"
      - "exam_difficulty"
    num_cols:
      - "age"
      - "study_hours"
      - "class_attendance"
      - "sleep_hours"
    problem_type: "regression"
  churn:
    id_column: "id"
    target: "Churn"
    cat_cols:
      - "gender"
      - "SeniorCitizen"
      - "Partner"
      - "Dependents"
      - "PhoneService"
      - "MultipleLines"
      - "InternetService"
      - "OnlineSecurity"
      - "OnlineBackup"
      - "DeviceProtection"
      - "TechSupport"
      - "StreamingTV"
      - "StreamingMovies"
      - "Contract"
      - "PaperlessBilling"
      - "PaymentMethod"
    num_cols:
      - "tenure"
      - "MonthlyCharges"
      - "TotalCharges"
    problem_type: "classification"
  insurance:
    id_column: "id"
    target: "Premium Amount"
    cat_cols:
      - "Gender"
      - "Marital Status"
      - "Education Level"
      - "Occupation"
      - "Location"
      - "Policy Type"
      - "Policy Start Date"
      - "Customer Feedback"
      - "Smoking Status"
      - "Exercise Frequency"
      - "Property Type"
    num_cols:
      - "Age"
      - "Annual Income"
      - "Number of Dependents"
      - "Health Score"
      - "Previous Claims"
      - "Vehicle Age"
      - "Credit Score"
      - "Insurance Duration"
    problem_type: "regression"
  water:
    target: "status_group"
    id_column: "id"
    problem_type: "classification"

gradient_boosting:
  weak_learner_key: "decision_tree"
  n_estimators: 10000
  learning_rate: 0.3
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  early_stopping_rounds: 25

decision_tree:
  max_depth: 5
  random_state: 42

neural_network:
  hidden_size: 32
  batch_size: 32