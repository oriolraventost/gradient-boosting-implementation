main:
  active_dataset: "scores"
  run_preprocess: true
  train_and_predict: false

gradient_boosting:
  weak_learner_key: "decision_tree"
  n_estimators: 10000
  learning_rate: 0.3
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  early_stopping_rounds: 25

decision_tree:
  max_depth: 5

neural_network:
  hidden_size: 32
  batch_size: 32