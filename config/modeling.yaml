main:
  active_dataset: "scores"
  run_preprocess: true
  train_and_predict: false

gradient_boosting:
  weak_learner_key: "neural_network"
  n_estimators: 1000
  learning_rate: 0.3
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  early_stopping_rounds: 10

decision_tree:
  max_depth: 5

neural_network:
  epochs: 30
  learning_rate: 0.0001
  hidden_size:
    - 16
    - 8
  batch_size: 256

convolutional_neural_network:
  epochs: 30
  learning_rate: 0.001
  channels:
    - 8
    - 16
  kernel_size: 5
  pool_size: 2
  hidden_size: 32
  batch_size: 256