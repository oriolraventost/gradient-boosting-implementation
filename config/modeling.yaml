main:
  active_dataset: "heart"
  run_preprocess: false
  train_and_predict: true

gradient_boosting:
  weak_learner_key: "convolutional_neural_network"
  n_estimators: 10
  learning_rate: 0.65
  subsample: 0.8
  colsample_bytree: 1.0
  reg_lambda: 0.65
  early_stopping_rounds: 10

decision_tree:
  max_depth: 5

neural_network:
  epochs: 100
  patience: 10
  learning_rate: 0.0001
  hidden_size: 32
  batch_size: 256

convolutional_neural_network:
  epochs: 100
  patience: 10
  learning_rate: 0.001
  channels:
    - 8
    - 16
  kernel_size: 3
  pool_size: 2
  hidden_size: 16
  batch_size: 256